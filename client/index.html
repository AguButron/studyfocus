<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudyFocus</title>
  </head>
  <body>
    <div id="app"></div>

    <header id="hud" hidden>
      <span class="brand">StudyFocus</span>
      <div class="hud-room">
        <span class="muted">Sala</span>
        <span id="room-code"></span>
        <button id="copy-link" class="button button-ghost" type="button">Copiar link</button>
      </div>
      <div class="hud-timer">
        <span id="mini-period" class="muted"></span>
        <span id="mini-time"></span>
      </div>
    </header>

    <p id="hint" hidden></p>

    <section id="study" aria-label="Sesión de estudio" hidden>
      <div id="study-panel">
        <div class="study-header">
          <span id="timer-period" class="period-badge"></span>
          <button id="stand-up" class="button button-ghost" type="button">Levantarte <kbd>E</kbd></button>
        </div>

        <div id="timer-time"></div>
        <div class="progress"><div id="timer-progress"></div></div>

        <div id="timer-actions" class="study-actions">
          <button id="timer-toggle" class="button button-primary" type="button"></button>
          <button id="timer-abandon" class="button button-ghost" type="button" hidden>Abandonar</button>
        </div>

        <div id="abandon-confirm" hidden>
          <p>¿Abandonar la sesión? Se perderá el tiempo que llevas.</p>
          <div class="study-actions">
            <button id="abandon-yes" class="button button-ghost" type="button">Sí, abandonar</button>
            <button id="abandon-no" class="button button-primary" type="button">Seguir</button>
          </div>
        </div>
        <p id="stand-up-hint" class="muted" hidden>Pausa el temporizador para levantarte.</p>

        <div id="duration-section" class="study-section">
          <h2>Duración</h2>
          <label class="slider">
            <span class="slider-label">Estudio <span id="study-value"></span></span>
            <input id="study-minutes" type="range" />
          </label>
          <label class="slider">
            <span class="slider-label">Descanso <span id="break-value"></span></span>
            <input id="break-minutes" type="range" />
          </label>
        </div>

        <div id="activity-section" class="study-section">
          <h2>¿Qué estás haciendo?</h2>
          <div class="segmented">
            <button data-activity="computer" type="button">Computador</button>
            <button data-activity="reading" type="button">Leyendo</button>
            <button data-activity="writing" type="button">Escribiendo</button>
          </div>
        </div>
      </div>

      <div id="camera-panel" hidden>
        <h2>Cámara <kbd>C</kbd></h2>
        <div class="segmented">
          <button data-camera="desk" type="button">Escritorio</button>
          <button data-camera="table" type="button">Mesa</button>
          <button data-camera="room" type="button">Sala</button>
        </div>
      </div>
    </section>

    <div id="player-card" role="status" hidden>
      <strong id="player-card-name"></strong>
      <span id="player-card-status"></span>
      <span id="player-card-activity" class="muted"></span>
      <span class="player-card-hint muted"><kbd>Esc</kbd> para volver</span>
    </div>

    <main id="home">
      <div class="home-card">
        <h1 class="brand">StudyFocus</h1>
        <p class="home-tagline">Tu mesa de estudio con amigos, estén donde estén.</p>

        <label class="field">
          Tu apodo
          <input id="nickname" maxlength="20" autocomplete="off" />
        </label>
        <button id="create" class="button button-primary" type="button">Crear una sala</button>

        <div class="home-divider"><span>o únete con un código</span></div>

        <div class="home-join">
          <label class="field">
            Código de sala
            <input id="code" maxlength="6" autocomplete="off" />
          </label>
          <button id="join" class="button button-ghost" type="button">Unirse</button>
        </div>

        <p id="home-error" role="alert"></p>
      </div>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
