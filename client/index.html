<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudyFocus</title>
  </head>
  <body>
    <div id="app"></div>
      <div id="hud" hidden>
        Sala <span id="room-code"></span>
        <button id="copy-link" type="button">Copiar link</button>
      </div>
      <div id="home">
        <h1>StudyFocus</h1>
        <label>
          Tu apodo
          <input id="nickname" maxlength="20" autocomplete="off" />
        </label>
        <button id="create" type="button">Crear una sala</button>
        <hr />
        <label>
          Código de sala
          <input id="code" maxlength="6" autocomplete="off" />
        </label>
        <button id="join" type="button">Unirse</button>
        <p id="home-error" role="alert"></p>
      </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
